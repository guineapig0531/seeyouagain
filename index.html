<dialog class="guide"><button class="dialog-close" onclick="this.parentElement.close()" aria-label="关闭说明">×</button><p class="eyebrow">PREVIEW NOTES</p><h2>从解锁开始。</h2><p>手机密码 <b>031107</b><br>隐藏相册密码 <b>0531</b></p><p>解锁后打开音乐，点击播放即可收听。底部横条可返回主屏幕。查看X并退出后，故事开始推进。</p><p>来电需要接听，音频播完后自动结束。KakaoTalk按截图逐句回复；收到语音后，输入任意文字发送。</p><p>第二通电话后，查看英宰X与新增KakaoTalk对话，完成后可拨打FaceTime。英宰推文详情可发表评论，最后一条只能选择指定评论。刷新页面会重新开始。天气为界面演示数据，地图为模拟地点卡片。隐藏相册密码属于故事机关。</p><p class="muted">本次仅为本地预览，尚未公开发布，手机真机测试尚未完成。</p></dialog>
